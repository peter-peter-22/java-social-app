services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: test-user
      MINIO_ROOT_PASSWORD: test-password
    command: [ "server", "/data", "--console-address", ":9001" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 1s
      timeout: 5s
      retries: 30

  image-transformer:
    build:
      context: ../../../../
      dockerfile: modules/uploads/image-transformer/docker/Dockerfile
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - JAVA_OPTS=-Xmx512m -XX:+UseContainerSupport
      - GRADLE_USER_HOME=/gradle-cache
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=test-user
      - MINIO_SECRET_KEY=test-password
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../../../../:/workspace
      - gradle-cache:/gradle-cache
      - gradle-project-cache:/gradle-project-cache
    command: [ "./gradlew", "--no-daemon", "--project-cache-dir=/gradle-project-cache", ":image-transformer:integrationTest" ]

volumes:
  gradle-cache:
  gradle-project-cache:
