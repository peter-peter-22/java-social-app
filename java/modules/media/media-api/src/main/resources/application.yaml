spring:
  application:
    name: media-api

  # The Minio defaults of the object-storage adapter; the environment overrides them through the
  # MINIO_* variables (the compose stack sets them for the worker).
  config:
    import: "classpath:minio-defaults.yaml"

  # The async image transforms publish commands here and the dead-lettered attempts are consumed
  # from here. The API declares the topology in MediaRabbitConfiguration.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:26257/defaultdb?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # The API runs the registry's migrations. The worker has no database and runs none.
  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
    enabled: true

server:
  port: 8090

# The blocking image worker the API calls over HTTP.
media:
  # The static key of the admin endpoints (/api/admin/**), sent as the X-Admin-Key header. The
  # deployment overrides it through MEDIA_ADMIN_KEY; the default is for local development only.
  admin-key: ${MEDIA_ADMIN_KEY:dev-admin-key}
  # Upload permission issuance (POST /api/admin/upload-permission) and enforcement on the upload
  # endpoint. `required: true` rejects an upload without a permission (403); a requested TTL or use
  # budget above the maximum is clamped, and an omitted value takes the default.
  upload-permission:
    required: true
    default-ttl: 10m
    max-ttl: 1h
    default-max-uses: 1
    max-uses: 10
  worker:
    base-url: ${MEDIA_WORKER_BASE_URL:http://localhost:8082}
    # Recoverable transport failures and worker 5xx answers are retried. Fresh result asset ids
    # make every retry write to new object keys. A 4xx answer is a command error and is not retried.
    max-retries: 3
    retry-delay-ms: 200
    connect-timeout-ms: 2000
    read-timeout-ms: 30000
