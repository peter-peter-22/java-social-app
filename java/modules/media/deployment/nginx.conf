# The minimal CDN edge of the media service: it verifies the signed download token of a read at
# /cdn/ and proxies the request to the media API. The API stays authoritative: the edge cannot know
# the current version of an upload, so a correctly signed token for an old version passes here and
# the API rejects it with 403.
#
# Edge caching is deliberately disabled: private media is cacheable, so a cache must authorize
# before it looks a response up. Browser caching still works through the Cache-Control of the API
# responses.
#
# This file is a template: the image substitutes the MEDIA_* variables with envsubst (see
# nginx.Dockerfile). MEDIA_DOWNLOAD_TOKEN_SECRET and MEDIA_DOWNLOAD_TOKEN_KEY_ID must be the values
# the API signs with, and MEDIA_API_BASE_URL is the API the edge proxies to.

load_module modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # The download token travels in the query string, so the access log records the path only:
    # $uri has no query string, which keeps e, s, and k out of the logs.
    log_format cdn '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log cdn;

    js_path /etc/nginx/njs/;
    js_import download_token from download_token.js;

    # The signing key of the download tokens, shared with the media API.
    js_var $download_token_secret "${MEDIA_DOWNLOAD_TOKEN_SECRET}";
    js_var $download_token_key_id "${MEDIA_DOWNLOAD_TOKEN_KEY_ID}";
    # A key rotation is an overlap: the current key signs, and the previous key still verifies tokens
    # minted before the switch. Leave both empty when no rotation is in progress.
    js_var $download_token_previous_key_id "${MEDIA_DOWNLOAD_TOKEN_PREVIOUS_KEY_ID}";
    js_var $download_token_previous_secret "${MEDIA_DOWNLOAD_TOKEN_PREVIOUS_SECRET}";
    # The clock-skew tolerance of the API, in seconds; both verifiers must allow the same window.
    js_var $download_token_clock_skew_seconds "${MEDIA_DOWNLOAD_TOKEN_CLOCK_SKEW_SECONDS}";

    server {
        listen 80;
        server_name _;

        location /cdn/ {
            # Rejects an incomplete, tampered, expired, or foreign-key token with 403 before the
            # proxy. A request without a token is passed through: the API serves a public upload and
            # rejects a private one.
            js_access download_token.authorize;

            # The pass drops the /cdn/ prefix and keeps the rest of the path, so
            # /cdn/{uploadKey}.{extension} and /cdn/{uploadKey}/{transformation}.{extension} become
            # the API read paths. The query string (v, e, s, k) is passed through unchanged.
            proxy_pass ${MEDIA_API_BASE_URL}/api/get/image/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # A URL that carries a token must not leak it through a cross-origin referrer.
            add_header Referrer-Policy no-referrer always;
        }
    }
}
